[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-quality-checks"
version = "0.1.0"
description = "Repository file hygiene and local Markdown reference checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
repo-hygiene = "repository_quality_checks.hygiene:main"
repo-doc-links = "repository_quality_checks.references:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
